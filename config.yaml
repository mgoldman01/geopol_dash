# Geopolitical Intelligence Platform Configuration
# Copy to config.local.yaml and edit for your environment

# =============================================================================
# Data Sources
# =============================================================================
data_sources:
  # Enable/disable data sources
  enabled:
    - gdelt      # GDELT 2.0 - always available, no API key needed
    # - acled    # Uncomment when ACLED API key is configured
    # - sipri    # Uncomment when SIPRI data files are imported
    # - news     # Uncomment when Anthropic API key is configured

  # GDELT configuration
  gdelt:
    # No API key required
    timeout_seconds: 30
    max_events_per_day: 10000  # Limit to prevent overwhelming queries

  # ACLED configuration (requires registration)
  acled:
    api_key: ${ACLED_API_KEY}  # Set via environment variable
    api_url: "https://api.acleddata.com/acled/read"

  # SIPRI configuration (manual data import)
  sipri:
    data_directory: "data/sipri"

  # News scraper configuration
  news:
    anthropic_api_key: ${ANTHROPIC_API_KEY}
    rss_feeds:
      - "https://feeds.reuters.com/Reuters/worldNews"
      - "https://feeds.bbci.co.uk/news/world/rss.xml"
    fetch_interval_minutes: 60

# =============================================================================
# Region Definitions
# =============================================================================
