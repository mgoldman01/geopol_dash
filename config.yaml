# =============================================================================
# Analysis Parameters
# =============================================================================
analysis:
  # Moving average window for smoothing event counts
  moving_average_window_days: 30

  # Baseline period for calculating deviations
  baseline_period_days: 90

  # Threshold for anomaly detection (standard deviations)
  anomaly_threshold_std: 2.0

  # Minimum events required for trend detection
  min_events_for_trend: 5

  # Goldstein score aggregation
  goldstein:
    # Weight events by number of mentions/sources
    weight_by_mentions: true
    # Exclude events below this mention count
    min_mentions: 2

  # Temporal clustering parameters
  temporal_clustering:
    # Max days between events to be considered a cluster
    max_gap_days: 3
    # Min events to form a cluster
    min_cluster_size: 3

# =============================================================================
# API Keys
# =============================================================================
# IMPORTANT: Never commit actual API keys to version control!
# Use environment variables or config.local.yaml (which is gitignored)
api_keys:
  anthropic: ${ANTHROPIC_API_KEY}
  # acled: ${ACLED_API_KEY}

# =============================================================================
# Database
# =============================================================================
database:
  path: "data/geopol.db"
  # Enable WAL mode for better concurrent read performance
  wal_mode: true

# =============================================================================
# Dashboard Settings
# =============================================================================
dashboard:
  # Default date range for event browser (days back from today)
  default_date_range_days: 30

  # Maximum events to display in table
  max_display_events: 500

  # Refresh interval for source status (seconds)
  status_refresh_seconds: 60

  # Default region selection
  default_region: "middle_east"

# =============================================================================
# Logging
# =============================================================================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  # Log to file in addition to console
  file: "logs/geopol.log"
  # Rotate logs when they exceed this size (MB)
  max_file_size_mb: 10
  # Keep this many backup log files
  backup_count: 5
