      - YEM  # Yemen
      - OMN  # Oman
      - KWT  # Kuwait
      - QAT  # Qatar
      - BHR  # Bahrain
      - JOR  # Jordan
      - LBN  # Lebanon
      - ISR  # Israel
      - PSE  # Palestine
      - EGY  # Egypt
      - TUR  # Turkey

  horn_of_africa:
